kind: Deployment
apiVersion: apps/v1
metadata:
  name: vllm-whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      name: whisper
      labels:
        app: whisper
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.9.2
        command: ["bash", "-c"]
        args:
          - |
            vllm serve RedHatAI/whisper-large-v3-FP8-dynamic \
              --enforce-eager \
              --gpu-memory-utilization 0.9 \
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - mountPath: /dev/shm
          name: dev-shm
        env:
        - name: NEMO_MODELS_CACHE
          value: "/workspace/.cache"
        - name: HF_HOME
          value: "/workspace/hf/cache"
        - name: HUGGINGFACE_HUB_CACHE
          value: "/workspace/hf/hub_cache"
        - name: API_PORT
          value: "8000"
        - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
          value: "1"
        - name: "HF_TOKEN"
          value: ""
        # for mig usage (vllm does not support multi-mig tensor-parallel)
        # resources:
        #   limits:
        #     nvidia.com/mig-2g.20gb: 1
        resources:
          limits:
            nvidia.com/gpu: 1
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: llama-workspace
      - emptyDir:
          medium: "Memory"
          sizeLimit: "64Gi"
        name: dev-shm
      - name: llama4-config
        configMap:
          name: llama4-config
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-nodeport
spec:
  type: NodePort
  selector:
    app: whisper
  ports:
    - name: http
      protocol: TCP
      port: 8000         # Target port (your app's internal port)
      targetPort: 8000   # Pod containerPort
      nodePort: 30003
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-workspace
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: nfs-csi