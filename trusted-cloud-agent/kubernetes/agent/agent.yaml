kind: Deployment
apiVersion: apps/v1
metadata:
  name: trusted-cloud-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      name: agent-api
      labels:
        app: agent-api
    spec:
      initContainers:
      - name: wait-for-qdrant
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo -e "Waiting for Qdrant and Ollama... \n"
            until wget -qO- http://qdrant.default.svc.cluster.local:6333/readyz && wget -qO- http://ollama:11434/api/tags; do
              echo "Still waiting... \n"
              sleep 5
            done
            echo "Qdrant and Ollama are ready! \n"
      containers:
      - name: llm-api
        image: kanic1111/trusted-cloud-agent:v1
        command: ["uvicorn"]
        args:
          - "llm_api:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "7001"
        volumeMounts:
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
      - name: jupyter-api
        image: kanic1111/trusted-cloud-agent:v1
        command: ["uvicorn"]
        args:
          - "jupyter_api:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8001"
        volumeMounts:
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
      - name: vm-api
        image: kanic1111/trusted-cloud-agent:v1
        command: ["uvicorn"]
        args:
          - "vm_api:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8002"
        volumeMounts:
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
      volumes:
      - name: config
        configMap:
          name: agent-config
---
apiVersion: v1
kind: Service
metadata:
  name: agents-nodeport
spec:
  type: NodePort
  selector:
    app: llama
  ports:
    - name: llm-api
      protocol: TCP
      port: 7001         # Target port (your app's internal port)
      targetPort: 7001   # Pod containerPort
      nodePort: 30071
    - name: jupyter-api
      protocol: TCP
      port: 8001         # Target port (your app's internal port)
      targetPort: 8001   # Pod containerPort
      nodePort: 30081
    - name: vm-api
      protocol: TCP
      port: 8002         # Target port (your app's internal port)
      targetPort: 8002   # Pod containerPort
      nodePort: 30082
