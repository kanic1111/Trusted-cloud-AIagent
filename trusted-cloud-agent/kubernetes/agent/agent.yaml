kind: Deployment
apiVersion: apps/v1
metadata:
  name: trusted-cloud-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      name: agent-api
      labels:
        app: agent-api
    spec:
      initContainers:
      - name: wait-for-qdrant
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo -e "Waiting for Qdrant and Ollama... \n"
            until wget -qO- http://qdrant.default.svc.cluster.local:6333/readyz && wget -qO- http://ollama:11435/api/tags; do
              echo "Still waiting... \n"
              sleep 5
            done
            echo "Qdrant and Ollama are ready! \n"
      containers:
      - name: agent
        image: kanic1111/trusted-cloud-agent:v3
        command: ["uvicorn"]
        args:
          - "agent_main:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8080"
        volumeMounts:
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
      volumes:
      - name: config
        configMap:
          name: agent-config
---
apiVersion: v1
kind: Service
metadata:
  name: agents-nodeport
spec:
  type: NodePort
  selector:
    app: agent-api
  ports:
    - name: agent-nodeport
      protocol: TCP
      port: 8080         # Target port (your app's internal port)
      targetPort: 8080   # Pod containerPort
      nodePort: 30071
