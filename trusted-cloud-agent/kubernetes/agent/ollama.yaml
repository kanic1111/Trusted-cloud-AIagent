apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
        - name: pull-bge-m3
          image: ollama/ollama:latest
          command:
            - sh
            - -c
            - |
              echo "Pulling bge-m3 model..."
              ollama serve >/var/log/ollama-serve.log 2>&1 & 
              sleep 2
              ollama pull qllama/bge-large-en-v1.5:latest
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: "ollama/ollama:latest"
          ports:
            - containerPort: 11435
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11435
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11435        # Target port (your app's internal port)
      targetPort: 11435   # Pod containerPort

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs-csi
