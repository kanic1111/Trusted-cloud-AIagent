apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: "qdrant/qdrant:latest"
          ports:
            - containerPort: 6333
          env:
            - name: API_URL
              value: 0.0.0.0:6333
          volumeMounts:
          - name: qdrant
            mountPath: /qdrant/storage/collections
      volumes:
      - name: qdrant
        hostPath:
          path: /home/ubuntu/storage_qdrant
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      protocol: TCP
      port: 6333         # Target port (your app's internal port)
      targetPort: 6333   # Pod containerPort