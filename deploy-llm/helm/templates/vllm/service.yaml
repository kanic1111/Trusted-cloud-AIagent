{{- $ctx := . }}
{{- range .Values.models }}
{{- if eq .infer_method  "vllm" }}
{{- $name := include "vllm.fullname" $ctx }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .service.name  | default $name }}
  labels:
    {{- include "vllm.labels" $ctx | nindent 4 }}
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: {{ .service.port }}
      protocol: TCP
      nodePort: {{ .service.nodeport }}
      name: {{ .service.name }}
  selector:
    {{- include "vllm.selectorLabels" $ctx | nindent 4 }}
{{- end }}
{{- end }}